name: Verify delivery kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Check document contract
        run: python3 scripts/check-kit.py
      - name: Exercise passing and adversarial release records
        run: python3 -m unittest discover -s tests -v
